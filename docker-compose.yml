name: ganlan-gold

x-app-environment: &app-environment
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
  NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?Set NEXT_PUBLIC_SITE_URL in .env}
  RATE_LIMIT_SECRET: ${RATE_LIMIT_SECRET:?Set RATE_LIMIT_SECRET in .env}
  SUBMISSION_FINGERPRINT_SECRET: ${SUBMISSION_FINGERPRINT_SECRET:?Set SUBMISSION_FINGERPRINT_SECRET in .env}
  PRIVACY_HASH_SECRET: ${PRIVACY_HASH_SECRET:?Set PRIVACY_HASH_SECRET in .env}
  CRON_SECRET: ${CRON_SECRET:?Set CRON_SECRET in .env}
  TRUST_PROXY: ${TRUST_PROXY:-true}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-}
  LEAD_NOTIFICATION_TO: ${LEAD_NOTIFICATION_TO:-}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ganlan_gold}
      POSTGRES_USER: ${POSTGRES_USER:-ganlan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    build:
      context: .
      target: migration
    restart: "no"
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
    command: ["migrate"]

  app:
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?Set NEXT_PUBLIC_SITE_URL in .env}
    restart: unless-stopped
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  rates:
    build:
      context: .
      target: migration
    restart: unless-stopped
    environment:
      <<: *app-environment
      RATE_REFRESH_INTERVAL_SECONDS: ${RATE_REFRESH_INTERVAL_SECONDS:-86400}
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["rates"]

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://localhost}
      ACME_EMAIL: ${ACME_EMAIL:-off}
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  backup:
    profiles: ["operations"]
    build:
      context: .
      target: operations
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      BACKUP_DIR: /backups
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/usr/local/bin/backup.sh"]

  restore:
    profiles: ["operations"]
    build:
      context: .
      target: operations
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
    volumes:
      - ./backups:/backups:ro
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/usr/local/bin/restore.sh"]

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
